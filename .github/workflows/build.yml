name: Build extension bundles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, edge, opera, firefox]
    steps:
      - uses: actions/checkout@v4

      - name: Read version from manifest.json
        id: version
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vendor transformers.js
        run: npm ci --ignore-scripts && npm run vendor

      - name: Stage extension source
        run: |
          mkdir -p staging
          cp manifest.json background.js content.js wordlist.js buzzwords.js \
             popup.html popup.js popup.css options.html options.js \
             offscreen.html offscreen.js staging/
          cp -r icons staging/icons
          cp -r vendor staging/vendor

      - name: Patch manifest for Firefox
        if: matrix.browser == 'firefox'
        run: |
          jq '. + {browser_specific_settings: {gecko: {id: "unslop@extension"}}}' \
            staging/manifest.json > staging/manifest.json.tmp
          mv staging/manifest.json.tmp staging/manifest.json

      - name: Zip bundle
        run: |
          mkdir -p dist
          cd staging
          zip -r "../dist/unslop-${{ matrix.browser }}-${{ steps.version.outputs.version }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: unslop-${{ matrix.browser }}
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
